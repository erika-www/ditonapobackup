<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1270" viewBox="0 0 1600 1270" role="img" aria-labelledby="title desc"><title id="title">Process Diagram · GPS Tracking &amp; Announcements</title><desc id="desc">One accepted GPS fix feeds an onboard state machine and a separate cloud tracking path.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#657a92"/></marker></defs><rect width="1600" height="1270" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="50" y="53" font-size="30" font-weight="700" fill="#172c46">Process Diagram · GPS Tracking &amp; Announcements</text><text x="50" y="84" font-size="17" fill="#536b83">One accepted GPS fix feeds an onboard state machine and a separate cloud tracking path.</text><rect x="35" y="120" width="740" height="1000" rx="18" fill="#fff5e9" fill-opacity=".45" stroke="#b87621" stroke-opacity=".4"/><rect x="820" y="120" width="745" height="1000" rx="18" fill="#edf9f4" fill-opacity=".45" stroke="#238463" stroke-opacity=".4"/><path d="M405.0,255 L405.0,300" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M225,355.0 L160,355 L160,435 L205,435 L205.0,465" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="150.0" y="417" width="30" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="165" y="433" text-anchor="middle" font-size="14" fill="#657a92">No</text><path d="M585,355.0 L650,355 L650,435 L565,435 L565.0,465" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="631.0" y="417" width="38" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="650" y="433" text-anchor="middle" font-size="14" fill="#657a92">Yes</text><path d="M565.0,575 L565.0,620" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="546.0" y="590" width="38" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="565" y="606" text-anchor="middle" font-size="14" fill="#657a92">Yes</text><path d="M400,520.0 L345,507.5" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="357.0" y="489" width="30" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="372" y="505" text-anchor="middle" font-size="14" fill="#657a92">No</text><path d="M565.0,710 L565,740 L750,740 L750,827 L730,827.5" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M397.5,885 L397,912 L220,912 L220.0,940" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M397.5,885 L397,912 L575,912 L575.0,940" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M585,355.0 L790,355 L790,212 L865,212.5" fill="none" stroke="#657a92" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="722.0" y="265" width="126" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="785" y="281" text-anchor="middle" font-size="14" fill="#657a92">accepted fixes</text><path d="M1190.0,255 L1190.0,310" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M1190.0,395 L1190.0,440" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M1010,500.0 L1000,500 L1000,590 L1000.0,620" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="985.0" y="572" width="30" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="1000" y="588" text-anchor="middle" font-size="14" fill="#657a92">No</text><path d="M1370,500.0 L1440,500 L1440,585 L1357,585 L1357.5,620" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="1421.0" y="568" width="38" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="1440" y="584" text-anchor="middle" font-size="14" fill="#657a92">Yes</text><path d="M1357.5,710 L1357.5,770" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M1357.5,860 L1357,902 L1190,902 L1190.0,940" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><text x="55" y="150" font-size="15" fill="#b87621" font-weight="700" text-anchor="start">LOCAL ONBOARD PATH · PI 3B</text><text x="840" y="150" font-size="15" fill="#238463" font-weight="700" text-anchor="start">CLOUD TRACKING PATH · PI 4B + SUPABASE</text><rect x="205" y="170" width="400" height="85" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="221" y="199" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Read GPS fix</text><text x="221" y="225" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">USB serial → NMEA latitude / longitude</text><path d="M405.0,300 L585,355.0 L405.0,410 L225,355.0 Z" fill="#fff5e9" stroke="#b87621" stroke-width="1.8"/><text x="405.0" y="352.0" font-size="18" fill="#172c46" font-weight="700" text-anchor="middle">Fix accepted?</text><text x="405.0" y="376.0" font-size="15" fill="#344a62" font-weight="400" text-anchor="middle">Valid fix + GPS jump filter</text><rect x="65" y="465" width="280" height="85" rx="11" fill="#f2f5f8" stroke="#687b8e" stroke-width="1.7"/><text x="81" y="494" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Wait for next GPS fix</text><text x="81" y="520" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">No fix / rejected jump</text><path d="M565.0,465 L730,520.0 L565.0,575 L400,520.0 Z" fill="#fff5e9" stroke="#b87621" stroke-width="1.8"/><text x="565.0" y="517.0" font-size="18" fill="#172c46" font-weight="700" text-anchor="middle">Trip active?</text><text x="565.0" y="541.0" font-size="15" fill="#344a62" font-weight="400" text-anchor="middle">GPS still updates when idle</text><rect x="400" y="620" width="330" height="90" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="416" y="649" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Calculate stop distance</text><text x="416" y="675" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Haversine distance in route order</text><rect x="65" y="770" width="665" height="115" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="81" y="799" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Advance trip state machine</text><text x="81" y="825" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">waiting → approaching → at_stop → next stop</text><text x="81" y="847" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Default: approach 140 m; arrival 5 m; departure 20 m</text><text x="81" y="869" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Pass detection can advance a missed stop; stop overrides apply</text><rect x="65" y="940" width="310" height="100" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="81" y="969" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Play announcement</text><text x="81" y="995" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">English / Tagalog audio queue</text><text x="81" y="1017" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Approaching, here, next</text><rect x="420" y="940" width="310" height="100" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="436" y="969" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Update screen / state</text><text x="436" y="995" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Current stop + GPS + trip phase</text><text x="436" y="1017" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Last stop → trip_complete</text><rect x="865" y="170" width="650" height="85" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="881" y="199" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Receive UDP JSON on Pi 4B</text><text x="881" y="225" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Pi4Sender sends accepted coordinates; bridge receives packets</text><rect x="865" y="310" width="650" height="85" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="881" y="339" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Upload to ingest-gps Edge Function</text><text x="881" y="365" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">HTTPS POST with x-device-key</text><path d="M1190.0,440 L1370,500.0 L1190.0,560 L1010,500.0 Z" fill="#edf9f4" stroke="#238463" stroke-width="1.8"/><text x="1190.0" y="497.0" font-size="18" fill="#172c46" font-weight="700" text-anchor="middle">Packet accepted?</text><text x="1190.0" y="521.0" font-size="15" fill="#344a62" font-weight="400" text-anchor="middle">Key, rate, position, time</text><rect x="865" y="620" width="270" height="100" rx="11" fill="#fff0f0" stroke="#b74f59" stroke-width="1.7"/><text x="881" y="649" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Return error</text><text x="881" y="675" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Validation failure:</text><text x="881" y="697" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">do not write location</text><rect x="1200" y="620" width="315" height="90" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="1216" y="649" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Insert GPS history</text><text x="1216" y="675" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">bus_locations</text><rect x="1200" y="770" width="315" height="90" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="1216" y="799" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Upsert latest location</text><text x="1216" y="825" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">bus_current_location</text><rect x="865" y="940" width="650" height="100" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="881" y="969" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Refresh live maps</text><text x="881" y="995" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Supabase Realtime + client polling</text><text x="881" y="1017" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Passenger app and personnel dashboard</text><text x="50" y="1150" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">The cloud upload and local announcement paths operate independently. Announcements do not require the cloud upload to succeed.</text><text x="50" y="1172" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">Default thresholds come from bus_announcer/config.json; departure is arrival radius (5 m) + depart_extra_m (15 m).</text><text x="50" y="1194" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">ingest-gps writes history and current location in separate operations. The diagram does not imply an atomic transaction.</text><text x="50" y="1246" font-size="13" fill="#6a7d91">DITO NA PO • Source: dito-na-po-wa - backup (5).zip • Static code and migration review • 21 October 2026</text></g></svg>