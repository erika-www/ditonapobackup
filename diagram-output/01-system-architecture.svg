700" text-anchor="start">WEB APPLICATIONS &amp; SHARED ASSETS</text><rect x="65" y="180" width="300" height="100" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="81" y="209" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Passenger web app</text><text x="81" y="235" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">React + Vite</text><text x="81" y="257" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Trip planning, QR pass, live map</text><rect x="415" y="180" width="300" height="100" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="431" y="209" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Personnel / admin app</text><text x="431" y="235" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">React + Vite</text><text x="431" y="257" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Duty trips, QR scans, reporting</text><rect x="765" y="180" width="270" height="100" rx="11" fill="#f4efff" stroke="#7956b6" stroke-width="1.7"/><text x="781" y="209" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Shared JavaScript</text><text x="781" y="235" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Stops + direction + QR rules</text><text x="781" y="257" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Queue prediction lookups</text><rect x="65" y="320" width="300" height="80" rx="11" fill="#f2f5f8" stroke="#687b8e" stroke-width="1.7"/><text x="81" y="349" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Map / ETA services</text><text x="81" y="375" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Leaflet + OSM; optional Google</text><rect x="765" y="320" width="270" height="80" rx="11" fill="#f4efff" stroke="#7956b6" stroke-width="1.7"/><text x="781" y="349" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Offline model training</text><text x="781" y="375" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Random Forest → static assets</text><text x="55" y="485" font-size="15" fill="#238463" font-weight="700" text-anchor="start">SUPABASE CLOUD</text><rect x="65" y="510" width="270" height="85" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="81" y="539" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Authentication</text><text x="81" y="565" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Accounts, sessions, profiles</text><rect x="390" y="510" width="300" height="85" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="406" y="539" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Data API + RPC</text><text x="406" y="565" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Journeys, trips, boarding, admin</text><rect x="745" y="510" width="290" height="85" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="761" y="539" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Realtime</text><text x="761" y="565" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Location and journey changes</text><rect x="65" y="650" width="970" height="85" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="81" y="679" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">PostgreSQL</text><text x="81" y="705" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Operational tables + boarding events + trip_occupancy view + GPS history / current location</text><text x="1130" y="150" font-size="15" fill="#687b8e" font-weight="700" text-anchor="start">ADDITIONAL REST BACKEND</text><rect x="1140" y="185" width="395" height="150" rx="11" fill="#f2f5f8" stroke="#687b8e" stroke-width="1.7"/><text x="1156" y="214" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">FastAPI /api/v1</text><text x="1156" y="240" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Auth, routes, stops, schedules</text><text x="1156" y="262" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Buses, trips, import, health</text><text x="1156" y="284" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">SQLAlchemy + Pydantic</text><rect x="1140" y="420" width="395" height="105" rx="11" fill="#f2f5f8" stroke="#687b8e" stroke-width="1.7"/><text x="1156" y="449" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Configured SQL database</text><text x="1156" y="475" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">DATABASE_URL</text><text x="1156" y="497" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Deployment target is configurable</text><text x="1140" y="580" font-size="16" fill="#20334c" font-weight="400" text-anchor="start">api.js clients exist in both web apps.</text><text x="1140" y="610" font-size="16" fill="#20334c" font-weight="400" text-anchor="start">Supabase and FastAPI are separate</text><text x="1140" y="634" font-size="16" fill="#20334c" font-weight="400" text-anchor="start">code paths in the supplied archive.</text><text x="55" y="830" font-size="15" fill="#b87621" font-weight="700" text-anchor="start">ONBOARD BUS SYSTEM</text><rect x="65" y="875" width="235" height="90" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="81" y="904" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">USB GPS receiver</text><text x="81" y="930" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Serial NMEA readings</text><rect x="350" y="855" width="330" height="130" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="366" y="884" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Raspberry Pi 3B</text><text x="366" y="910" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">GPSReader → TripTracker</text><text x="366" y="932" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Audio + display + local HTTP API</text><text x="366" y="954" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">English / Tagalog announcements</text><rect x="745" y="855" width="330" height="130" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="761" y="884" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Raspberry Pi 4B bridge</text><text x="761" y="910" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">UDP GPS receiver → cloud upload</text><text x="761" y="932" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">HTTP trip / direction relay</text><text x="761" y="954" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Cloud command polling fallback</text><rect x="1150" y="855" width="380" height="130" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="1166" y="884" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Supabase Edge Functions</text><text x="1166" y="910" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">ingest-gps: device + GPS checks</text><text x="1166" y="932" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">bus-direction: command endpoint</text><text x="1166" y="954" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">device_keys + bus_commands</text><text x="50" y="1100" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">Cloud arrows summarize data paths; Realtime also supplies the passenger app. Dashed lines indicate alternate or summarized connections.</text><text x="50" y="1122" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">The bus-direction endpoint and device poller exist; a web-app call to that cloud endpoint was not found. Runtime deployment was not verified.</text><text x="50" y="1166" font-size="13" fill="#6a7d91">DITO NA PO • Source: dito-na-po-wa - backup (5).zip • Static code and migration review • 21 October 2026</text></g></svg>