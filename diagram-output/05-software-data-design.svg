<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350" role="img" aria-labelledby="title desc"><title id="title">Software Design · Core Data Relationships</title><desc id="desc">Selected Supabase entities and relationships verified in SQL migrations; fields are abbreviated.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#657a92"/></marker></defs><rect width="1600" height="1350" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="50" y="53" font-size="30" font-weight="700" fill="#172c46">Software Design · Core Data Relationships</text><text x="50" y="84" font-size="17" fill="#536b83">Selected Supabase entities and relationships verified in SQL migrations; fields are abbreviated.</text><path d="M240.0,290 L240.0,390" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="201.0" y="335" width="78" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="240" y="351" text-anchor="middle" font-size="14" fill="#657a92">1 → 0..*</text><path d="M415,225.0 L605,242.5" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="466.0" y="205" width="78" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="505" y="221" text-anchor="middle" font-size="14" fill="#657a92">1 → 0..*</text><path d="M1190,225.0 L985,242.5" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="1046.0" y="205" width="78" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="1085" y="221" text-anchor="middle" font-size="14" fill="#657a92">1 → 0..*</text><path d="M795.0,325 L795.0,430" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="712.0" y="362" width="166" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="795" y="378" text-anchor="middle" font-size="14" fill="#657a92">0..1 trip / journey</text><path d="M415,715.0 L465,715 L465,525 L605,525.0" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="389.0" y="609" width="190" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="484" y="625" text-anchor="middle" font-size="14" fill="#657a92">0..1 profile / journey</text><path d="M795.0,620 L795.0,765" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="708.0" y="682" width="174" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="795" y="698" text-anchor="middle" font-size="14" fill="#657a92">0..1 journey / event</text><path d="M985,242.5 L1060,242 L1060,847 L985,847.5" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="997.0" y="721" width="126" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="1060" y="737" text-anchor="middle" font-size="14" fill="#657a92">1 trip / event</text><path d="M795.0,930 L795.0,1060" fill="none" stroke="#657a92" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="656.0" y="985" width="278" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="795" y="1001" text-anchor="middle" font-size="14" fill="#657a92">derived; excludes reversed events</text><path d="M1365.0,290 L1365.0,400" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="1326.0" y="335" width="78" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="1365" y="351" text-anchor="middle" font-size="14" fill="#657a92">1 → 0..*</text><path d="M1540,225.0 L1560,225 L1560,637 L1540,637.5" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="1456.0" y="535" width="78" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="1495" y="551" text-anchor="middle" font-size="14" fill="#657a92">1 → 0..*</text><path d="M1190,225.0 L1155,225 L1155,822 L1190,822.5" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="1109.0" y="713" width="78" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="1148" y="729" text-anchor="middle" font-size="14" fill="#657a92">1 → 0..1</text><path d="M1540,225.0 L1575,225 L1575,1007 L1540,1007.5" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="1449.0" y="905" width="78" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="1488" y="921" text-anchor="middle" font-size="14" fill="#657a92">1 → 0..*</text><path d="M65,1030.0 L40,1030 L40,125 L795,125 L795.0,160" fill="none" stroke="#657a92" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="384.0" y="108" width="182" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="475" y="124" text-anchor="middle" font-size="14" fill="#657a92">3 optional duty links</text><rect x="65" y="160" width="350" height="130" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="81" y="189" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">routes</text><text x="81" y="215" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK id • code • name</text><text x="81" y="237" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">origin_stop_name / destination_stop_name</text><text x="81" y="259" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">est_minutes</text><rect x="65" y="390" width="350" height="130" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="81" y="419" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">stops</text><text x="81" y="445" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK id • FK route_id (nullable)</text><text x="81" y="467" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">sequence_number • name</text><text x="81" y="489" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">latitude • longitude</text><rect x="605" y="160" width="380" height="165" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="621" y="189" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">trips</text><text x="621" y="215" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK id • FK bus_id • FK route_id</text><text x="621" y="237" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">status • started_at • ended_at</text><text x="621" y="259" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">driver / conductor / dispatcher IDs</text><text x="621" y="281" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Staff IDs reference operations_personnel</text><rect x="1190" y="160" width="350" height="130" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="1206" y="189" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">buses</text><text x="1206" y="215" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK id • plate_number (unique)</text><text x="1206" y="237" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">capacity • status</text><rect x="65" y="650" width="350" height="130" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="81" y="679" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">profiles</text><text x="81" y="705" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK/FK id → auth.users</text><text x="81" y="727" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">full_name • email • role</text><text x="81" y="749" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Profile of the authenticated user</text><rect x="605" y="430" width="380" height="190" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="621" y="459" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">passenger_journeys</text><text x="621" y="485" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK id • FK passenger_id • FK trip_id</text><text x="621" y="507" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">qr_token • origin / destination names</text><text x="621" y="529" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">passenger_count • category • companions</text><text x="621" y="551" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">status • boarded_at • alighted_at</text><text x="621" y="573" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Optional trip link until assignment</text><rect x="605" y="765" width="380" height="165" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="621" y="794" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">boarding_events</text><text x="621" y="820" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK id • FK trip_id • FK bus_id</text><text x="621" y="842" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">FK passenger_id • FK journey_id</text><text x="621" y="864" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">FK recorded_by → profiles</text><text x="621" y="886" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">event_type • method • idempotency_key</text><text x="621" y="908" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">is_reversed • reversal_reason</text><rect x="605" y="1060" width="380" height="130" rx="11" fill="#f4efff" stroke="#7956b6" stroke-width="1.7"/><text x="621" y="1089" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">trip_occupancy (VIEW)</text><text x="621" y="1115" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Derived per trip + bus capacity</text><text x="621" y="1137" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">SUM party counts: board − alight</text><text x="621" y="1159" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Available seats + standing passengers</text><rect x="1190" y="400" width="350" height="105" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="1206" y="429" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">device_keys</text><text x="1206" y="455" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK id • FK bus_id • key_hash</text><text x="1206" y="477" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">revoked_at</text><rect x="1190" y="585" width="350" height="105" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="1206" y="614" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">bus_locations</text><text x="1206" y="640" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK id • FK bus_id</text><text x="1206" y="662" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Coordinates + recorded_at (history)</text><rect x="1190" y="770" width="350" height="105" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="1206" y="799" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">bus_current_location</text><text x="1206" y="825" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK/FK bus_id → buses</text><text x="1206" y="847" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Latest coordinates + updated_at</text><rect x="1190" y="955" width="350" height="105" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="1206" y="984" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">bus_commands</text><text x="1206" y="1010" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK id • FK bus_id</text><text x="1206" y="1032" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">command_type • direction • status</text><rect x="65" y="965" width="350" height="130" rx="11" fill="#f2f5f8" stroke="#687b8e" stroke-width="1.7"/><text x="81" y="994" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">operations_personnel</text><text x="81" y="1020" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PK id • UNIQUE personnel_id</text><text x="81" y="1042" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">full_name • personnel_type • is_active</text><text x="81" y="1064" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Duty assignments on trips</text><text x="50" y="1230" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">PK = primary key; FK = foreign key. Arrows run from parent / source to child / derived view. Cardinality labels describe the relationship.</text><text x="50" y="1252" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">Latest migrations allow anonymous/manual journeys (nullable passenger_id). Trip, journey, and recorder links may also be nullable.</text><text x="50" y="1274" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">For readability, approval tables and some direct event FKs are omitted. Bus and profile event references are listed inside boarding_events.</text><text x="50" y="1326" font-size="13" fill="#6a7d91">DITO NA PO • Source: dito-na-po-wa - backup (5).zip • Static code and migration review • 21 October 2026</text></g></svg>