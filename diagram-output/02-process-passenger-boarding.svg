<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1270" viewBox="0 0 1600 1270" role="img" aria-labelledby="title desc"><title id="title">Process Diagram · Passenger Journey &amp; Boarding</title><desc id="desc">From journey planning and QR issuance to boarding, alighting, and feedback.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#657a92"/></marker></defs><rect width="1600" height="1270" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="50" y="53" font-size="30" font-weight="700" fill="#172c46">Process Diagram · Passenger Journey &amp; Boarding</text><text x="50" y="84" font-size="17" fill="#536b83">From journey planning and QR issuance to boarding, alighting, and feedback.</text><rect x="35" y="120" width="460" height="1000" rx="18" fill="#eef5ff" fill-opacity=".45" stroke="#3374c5" stroke-opacity=".4"/><rect x="540" y="120" width="510" height="1000" rx="18" fill="#fff5e9" fill-opacity=".45" stroke="#b87621" stroke-opacity=".4"/><rect x="1095" y="120" width="470" height="1000" rx="18" fill="#edf9f4" fill-opacity=".45" stroke="#238463" stroke-opacity=".4"/><path d="M265.0,265 L265.0,310" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M265.0,415 L265.0,460" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M265.0,565 L265.0,610" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M265.0,700 L265.0,825" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M795.0,265 L795.0,310" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M465,655.0 L515,655 L515,355 L575,355.0" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="463.0" y="565" width="94" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="510" y="581" text-anchor="middle" font-size="14" fill="#657a92">present QR</text><path d="M795.0,400 L795.0,440" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M795.0,560 L795.0,610" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="776.0" y="574" width="38" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="795" y="590" text-anchor="middle" font-size="14" fill="#657a92">Yes</text><path d="M975,500.0 L1125,500.0" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="1035.0" y="469" width="30" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="1050" y="485" text-anchor="middle" font-size="14" fill="#657a92">No</text><path d="M795.0,725 L795,760 L675,760 L675.0,795" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="660.0" y="741" width="30" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="675" y="757" text-anchor="middle" font-size="14" fill="#657a92">No</text><path d="M975,667.5 L1030,667 L1030,760 L915,760 L915.0,795" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="962.0" y="741" width="38" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="981" y="757" text-anchor="middle" font-size="14" fill="#657a92">Yes</text><path d="M675.0,915 L675,950 L1330,950 L1330.0,915" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="842.0" y="933" width="126" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="905" y="949" text-anchor="middle" font-size="14" fill="#657a92">event + status</text><path d="M1015,855.0 L1125,855.0" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M1330.0,915 L1330.0,975" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M1330.0,915 L1330,1090 L265,1090 L265.0,935" fill="none" stroke="#657a92" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="633.0" y="1073" width="94" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="680" y="1089" text-anchor="middle" font-size="14" fill="#657a92">refresh UI</text><text x="55" y="150" font-size="15" fill="#3374c5" font-weight="700" text-anchor="start">PASSENGER APP</text><text x="560" y="150" font-size="15" fill="#b87621" font-weight="700" text-anchor="start">PERSONNEL APP</text><text x="1115" y="150" font-size="15" fill="#238463" font-weight="700" text-anchor="start">SHARED JOURNEY STATE</text><rect x="65" y="175" width="400" height="90" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="81" y="204" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Choose a journey</text><text x="81" y="230" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Select origin, destination, direction</text><rect x="65" y="310" width="400" height="105" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="81" y="339" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Enter passenger details</text><text x="81" y="365" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Category + companions + party count</text><text x="81" y="387" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Check active journey / stop selection</text><rect x="65" y="460" width="400" height="105" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="81" y="489" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Save passenger journey</text><text x="81" y="515" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Generate daily pass ID + QR payload</text><text x="81" y="537" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Persist journey; test mode can save locally</text><rect x="65" y="610" width="400" height="90" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="81" y="639" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Show / download QR pass</text><text x="81" y="665" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Journey state: planned</text><rect x="65" y="825" width="400" height="110" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="81" y="854" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Track the journey</text><text x="81" y="880" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Bus map + seat availability + status</text><text x="81" y="902" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Realtime subscriptions and polling</text><rect x="575" y="175" width="440" height="90" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="591" y="204" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Start / resume duty trip</text><text x="591" y="230" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Assign bus + staff; send direction to bridge</text><rect x="575" y="310" width="440" height="90" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="591" y="339" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Scan QR / enter pass code</text><text x="591" y="365" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Scanner requires an active operational trip</text><path d="M795.0,440 L975,500.0 L795.0,560 L615,500.0 Z" fill="#fff5e9" stroke="#b87621" stroke-width="1.8"/><text x="795.0" y="497.0" font-size="18" fill="#172c46" font-weight="700" text-anchor="middle">Pass valid?</text><text x="795.0" y="521.0" font-size="15" fill="#344a62" font-weight="400" text-anchor="middle">Registry + direction checks</text><path d="M795.0,610 L975,667.5 L795.0,725 L615,667.5 Z" fill="#fff5e9" stroke="#b87621" stroke-width="1.8"/><text x="795.0" y="664.5" font-size="18" fill="#172c46" font-weight="700" text-anchor="middle">Already boarded?</text><rect x="575" y="795" width="200" height="120" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="591" y="824" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Board</text><text x="591" y="850" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Check seat limits</text><text x="591" y="872" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Record board event</text><rect x="815" y="795" width="200" height="120" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="831" y="824" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Alight</text><text x="831" y="850" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Record alight event</text><text x="831" y="872" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Restore seat count</text><rect x="1125" y="445" width="410" height="110" rx="11" fill="#fff0f0" stroke="#b74f59" stroke-width="1.7"/><text x="1141" y="474" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Reject / show error</text><text x="1141" y="500" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Unknown pass, no active trip,</text><text x="1141" y="522" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">wrong direction, or capacity limit</text><rect x="1125" y="795" width="410" height="120" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="1141" y="824" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Update journey + occupancy</text><text x="1141" y="850" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">boarded / completed</text><text x="1141" y="872" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Persist events; refresh onboard totals</text><text x="1141" y="894" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Notify app views / refresh registry</text><rect x="1125" y="975" width="410" height="90" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="1141" y="1004" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Journey history &amp; feedback</text><text x="1141" y="1030" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Passenger reviews completed journey</text><text x="50" y="1155" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">Board and alight are alternative actions: the scanner uses the current journey state to choose the event type.</text><text x="50" y="1177" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">The code also supports manual registration, destination-based alighting, and local test fallbacks; these are summarized here.</text><text x="50" y="1199" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">Capacity and category checks vary by personnel screen. A QR pass represents a party; occupancy counts its passenger_count.</text><text x="50" y="1246" font-size="13" fill="#6a7d91">DITO NA PO • Source: dito-na-po-wa - backup (5).zip • Static code and migration review • 21 October 2026</text></g></svg>