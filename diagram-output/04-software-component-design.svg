<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc"><title id="title">Software Design · Components &amp; Dependencies</title><desc id="desc">Module responsibilities and dependency direction, grouped by application.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#657a92"/></marker></defs><rect width="1600" height="1240" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="50" y="53" font-size="30" font-weight="700" fill="#172c46">Software Design · Components &amp; Dependencies</text><text x="50" y="84" font-size="17" fill="#536b83">Module responsibilities and dependency direction, grouped by application.</text><rect x="35" y="120" width="740" height="420" rx="18" fill="#eef5ff" fill-opacity=".45" stroke="#3374c5" stroke-opacity=".4"/><rect x="825" y="120" width="740" height="420" rx="18" fill="#f4efff" fill-opacity=".45" stroke="#7956b6" stroke-opacity=".4"/><rect x="35" y="590" width="740" height="490" rx="18" fill="#fff5e9" fill-opacity=".45" stroke="#b87621" stroke-opacity=".4"/><rect x="825" y="590" width="740" height="490" rx="18" fill="#edf9f4" fill-opacity=".45" stroke="#238463" stroke-opacity=".4"/><path d="M227.5,315 L227.5,380" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M582.5,315 L582.5,380" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M1195.0,380 L1195.0,315" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="1144.0" y="335" width="102" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="1195" y="351" text-anchor="middle" font-size="14" fill="#657a92">static data</text><path d="M227.5,175 L227,166 L1195,166 L1195.0,175" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="665.0" y="150" width="70" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="700" y="166" text-anchor="middle" font-size="14" fill="#657a92">imports</text><path d="M745,245.0 L865,245.0" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M390,702.5 L420,702.5" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M582.5,755 L582.5,825" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="551.0" y="784" width="62" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="582" y="800" text-anchor="middle" font-size="14" fill="#657a92">events</text><path d="M227.5,755 L227.5,825" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="164.0" y="785" width="126" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="227" y="801" text-anchor="middle" font-size="14" fill="#657a92">accepted fixes</text><path d="M227.5,490 L227,560 L1022,560 L1022.5,650" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><rect x="540.0" y="542" width="110" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="595" y="558" text-anchor="middle" font-size="14" fill="#657a92">Supabase SDK</text><path d="M582.5,490 L582,575 L1022,575 L1022.5,650" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M420,435.0 L405,435 L405,890 L390,890.0" fill="none" stroke="#657a92" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="357.0" y="565" width="94" height="22" rx="4" fill="white" fill-opacity=".95"/><text x="404" y="581" text-anchor="middle" font-size="14" fill="#657a92">local HTTP</text><path d="M1022.5,800 L1195.0,885" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><path d="M1367.5,800 L1367,840 L1545,840 L1545,940 L1525,940.0" fill="none" stroke="#657a92" stroke-width="1.9" marker-end="url(#arrow)"/><text x="55" y="150" font-size="15" fill="#3374c5" font-weight="700" text-anchor="start">REACT APPLICATIONS</text><rect x="65" y="175" width="325" height="140" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="81" y="204" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Passenger UI</text><text x="81" y="230" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">App + AuthContext</text><text x="81" y="252" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">StartTripInterface</text><text x="81" y="274" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">InteractiveMap + StopQueuePredictor</text><rect x="420" y="175" width="325" height="140" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="436" y="204" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Personnel / admin UI</text><text x="436" y="230" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">ProtectedRoute + AuthContext</text><text x="436" y="252" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">RouteInformation + PassengerCheckIn</text><text x="436" y="274" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Admin pages + daily summary</text><rect x="65" y="380" width="325" height="110" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="81" y="409" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Passenger services</text><text x="81" y="435" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">supabaseClient + api.js</text><text x="81" y="457" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">geoUtils + QR generator</text><text x="81" y="479" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">googleMapsService</text><rect x="420" y="380" width="325" height="110" rx="11" fill="#eef5ff" stroke="#3374c5" stroke-width="1.7"/><text x="436" y="409" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Personnel services</text><text x="436" y="435" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">supabaseClient + api.js</text><text x="436" y="457" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">busAnnouncerBridge</text><text x="436" y="479" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PDF report generator</text><text x="845" y="150" font-size="15" fill="#7956b6" font-weight="700" text-anchor="start">SHARED DOMAIN RULES &amp; DATA</text><rect x="865" y="175" width="660" height="140" rx="11" fill="#f4efff" stroke="#7956b6" stroke-width="1.7"/><text x="881" y="204" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Shared JavaScript modules</text><text x="881" y="230" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">route4Stops: stop order, coordinates, direction validation</text><text x="881" y="252" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">qrPassUtils: pass generation, parsing, priority categories</text><text x="881" y="274" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">queueAndBoardingService: prediction lookup by stop / period</text><rect x="865" y="380" width="660" height="110" rx="11" fill="#f4efff" stroke="#7956b6" stroke-width="1.7"/><text x="881" y="409" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Prediction asset pipeline</text><text x="881" y="435" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">train_random_forest.py → shared/data/rfPredictions.js</text><text x="881" y="457" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Precomputed queue / boarding recommendations; browser lookup</text><text x="881" y="479" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Training runs offline; no live inference server is shown in source</text><text x="55" y="620" font-size="15" fill="#b87621" font-weight="700" text-anchor="start">ONBOARD PYTHON MODULES</text><rect x="65" y="650" width="325" height="105" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="81" y="679" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">main.py orchestration</text><text x="81" y="705" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Load config + routes; wire callbacks</text><text x="81" y="727" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">GPSReader + jump_filter</text><rect x="420" y="650" width="325" height="105" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="436" y="679" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">TripTracker</text><text x="436" y="705" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">start_trip / update / end_trip</text><text x="436" y="727" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Distance-based state machine</text><rect x="420" y="825" width="325" height="130" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="436" y="854" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">AudioManager / DisplayState</text><text x="436" y="880" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Queue bilingual audio + reminders</text><text x="436" y="902" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Thread-safe display snapshot</text><text x="436" y="924" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Screen renders current state</text><rect x="65" y="825" width="325" height="130" rx="11" fill="#fff5e9" stroke="#b87621" stroke-width="1.7"/><text x="81" y="854" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Pi4Sender + bridge.py</text><text x="81" y="880" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">UDP transport + HTTP relay</text><text x="81" y="902" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">GPS upload + command polling</text><text x="81" y="924" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">web.py exposes Pi 3B control API</text><text x="845" y="620" font-size="15" fill="#238463" font-weight="700" text-anchor="start">SERVER &amp; PERSISTENCE MODULES</text><rect x="865" y="650" width="315" height="150" rx="11" fill="#edf9f4" stroke="#238463" stroke-width="1.7"/><text x="881" y="679" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Supabase services</text><text x="881" y="705" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Auth + Data API + Realtime</text><text x="881" y="727" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">SQL RPC + triggers + views</text><text x="881" y="749" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">PostgreSQL operational tables</text><text x="881" y="771" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Edge: ingest-gps / bus-direction</text><rect x="1210" y="650" width="315" height="150" rx="11" fill="#f2f5f8" stroke="#687b8e" stroke-width="1.7"/><text x="1226" y="679" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">FastAPI backend</text><text x="1226" y="705" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">v1 routers → dependencies</text><text x="1226" y="727" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Pydantic schemas</text><text x="1226" y="749" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">SQLAlchemy models / session</text><text x="1226" y="771" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Alembic migrations</text><rect x="865" y="885" width="660" height="110" rx="11" fill="#f2f5f8" stroke="#687b8e" stroke-width="1.7"/><text x="881" y="914" font-size="19" fill="#172c46" font-weight="700" text-anchor="start">Persistence boundaries</text><text x="881" y="940" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">Supabase migrations define operational relationships and RPCs.</text><text x="881" y="962" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">FastAPI uses a configurable DATABASE_URL and its own ORM models.</text><text x="881" y="984" font-size="16" fill="#344a62" font-weight="400" text-anchor="start">The archive does not establish a single shared deployment target.</text><text x="50" y="1120" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">Arrows show calls, imports, events, or data production as labeled; this is a component dependency view rather than a class inheritance diagram.</text><text x="50" y="1142" font-size="15" fill="#51657d" font-weight="400" text-anchor="start">api.js REST clients target FastAPI. Supabase service modules directly access cloud services. Local test branches also use browser storage.</text><text x="50" y="1216" font-size="13" fill="#6a7d91">DITO NA PO • Source: dito-na-po-wa - backup (5).zip • Static code and migration review • 21 October 2026</text></g></svg>